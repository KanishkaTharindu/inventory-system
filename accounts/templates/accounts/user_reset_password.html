{% extends "base.html" %}
{% load ui %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Reset password: {{ target.name }}</h1></div></div>
<form method="post" class="card card-body stack narrow" autocomplete="off" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-error" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  {% field form.password %}
  <div class="form-actions"><a class="btn btn-secondary" href="{% url 'accounts:user_list' %}">Cancel</a><button class="btn" type="submit">Reset password</button></div>
</form>
{% endblock %}
